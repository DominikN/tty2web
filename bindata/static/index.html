<!doctype html>
<html>
  <head>
    <title>{{ .title }}</title>
    <meta charset="utf-8">
    <!-- Without a viewport tag mobile browsers assume a desktop-width page and
         scale it down, which makes the terminal unreadable. viewport-fit=cover
         lets the key bar sit under the home indicator using safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <!-- "Add to Home Screen" then runs without browser chrome, which is worth
         several terminal rows on a phone. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="./css/index.css" />
    <link rel="stylesheet" href="./css/xterm.css" />
    <link rel="stylesheet" href="./css/xterm_customize.css" />
  </head>
  <body>

<div id="topnav" class="topleftnav" onmouseover="openNav()">
</div>

<div id="mySidenav" class="sidenav">
  <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
  <a href="dl/" id="download" target="_blank" rel="noopener noreferrer">Download</a>
  <a href="ul/" id="upload" target="_blank" rel="noopener noreferrer">Upload</a>
  <a href="api/" id="api" target="_blank" rel="noopener noreferrer">API</a>
  <a href="sc/" id="scexec" target="_blank" rel="noopener noreferrer">Scexec</a>
  <a href="regeorg/" id="regeorg" target="_blank" rel="noopener noreferrer">Regeorg</a>
  <a href="javascript:void(0)" onclick="closeTop()">Hide Navigation</a>
</div>

    <div id="terminal"></div>
    <script src="./auth_token.js"></script>
    <script src="./config.js"></script>
  </body>
</html>
